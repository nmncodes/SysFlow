spring:
  application:
    name: sysflow-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sysflow}
    username: ${POSTGRES_USER:sysflow}
    password: ${POSTGRES_PASSWORD:sysflow}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 5000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  lifecycle:
    timeout-per-shutdown-phase: 20s

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: '0'
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8081
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/javascript,text/html,text/css,text/plain
  tomcat:
    connection-timeout: 10s
    keep-alive-timeout: 30s
    max-connections: 200
    threads:
      max: 50
      min-spare: 5
  shutdown: graceful
  error:
    # Spring's default suppresses the exception message from error responses entirely -
    # every ResponseStatusException(..., "some useful reason") across the app was silently
    # losing that reason before reaching the client. This is a read-only JSON API with no
    # server-rendered error pages, so there's no stack-trace/HTML leakage risk in exposing it.
    include-message: always

jwt:
  secret: ${JWT_SECRET:change-me-in-env-this-is-a-dev-only-default-secret-value}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.0-flash}

cors:
  # Comma-separated list. Defaults cover local dev + the deployed Vercel frontend so the app
  # works out of the box; override via env var if the Vercel URL ever changes.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://sys-flow-green.vercel.app}

rate-limit:
  # Forwarded client addresses are ignored unless the immediate peer matches one
  # of these trusted proxy CIDRs. Leave empty when the app is reached directly.
  trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}

resilience4j:
  circuitbreaker:
    instances:
      azurePricing:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 8s
        slow-call-rate-threshold: 80
